# Escaneos de seguridad de Rapid OS (base de seguridad: docs en .rapid-os/standards/security.md).
# Lo escribió Rapid OS al cerrar el onboarding de un repositorio vacío: revísalo antes del primer commit.
# Las acciones están fijadas por SHA completo del commit, con su versión en un comentario.
name: rapid-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
# if primary
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks 8.30.1 (suma de verificación fijada)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Buscar secretos en el historial
        run: ./gitleaks git --redact --verbose --exit-code 1
# endif
# endif

  static:
    name: Análisis estático (semgrep OWASP Top 10 y brakeman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: ruby
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar semgrep
        run: python -m pip install semgrep==1.182.1
      - name: semgrep con las reglas OWASP Top 10
        run: semgrep scan --config p/owasp-top-ten --error --metrics=off
      - name: brakeman
        run: |
          if [ -f Gemfile ]; then
            gem install brakeman -v 8.1.0
            brakeman --no-pager --exit-on-warn
          else
            echo "Sin Gemfile todavía: nada que analizar."
          fi

  # Una vez por carpeta de componente (backend/, o la raíz en un proyecto de una carpeta): el manifiesto y
  # el lockfile están ahí.
  # Fuentes: https://github.com/rubysec/bundler-audit ,
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands
  dependencies:
    name: Dependencias (bundler-audit) · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: {RAPID_COMPONENT_DIRS}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar que la carpeta del componente tiene código
        id: folder
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -d "$DIR" ] && [ -n "$(find "$DIR" -type f \( -name '*.rb' -o -name Gemfile -o -name Gemfile.lock \) -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)" ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Nada que auditar::$DIR no existe o no tiene código Ruby todavía: no se auditó ninguna dependencia."
            echo "Nada que auditar: $DIR no existe o no tiene código Ruby todavía." >> "$GITHUB_STEP_SUMMARY"
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        if: steps.folder.outputs.audit == 'true'
        with:
          ruby-version: ruby
      - name: Auditar las dependencias con bundler-audit
        if: steps.folder.outputs.audit == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -f Gemfile.lock ]; then
            gem install bundler-audit -v 0.9.3
            bundle-audit check --update
          else
            echo "::error title=Faltan las dependencias::$DIR tiene código Ruby pero no tiene Gemfile.lock: genéralo y haz commit para que se audite."
            exit 1
          fi

# if corporate
  sbom:
    name: SBOM (anchore/sbom-action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  provenance:
    name: Procedencia firmada (SLSA Build L2)
    if: github.event_name == 'push'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      # Cuando el proyecto tenga un artefacto desplegable (imagen, paquete, wheel), cambia
      # subject-path por ese artefacto: la procedencia debe describir lo que se publica.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.spdx.json
# endif
