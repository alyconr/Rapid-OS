# Escaneos de seguridad de Rapid OS (base de seguridad: docs en .rapid-os/standards/security.md).
# Lo escribió Rapid OS al cerrar el onboarding de un repositorio vacío: revísalo antes del primer commit.
# Las acciones están fijadas por SHA completo del commit, con su versión en un comentario.
name: rapid-security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
# if primary
  secrets:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Instalar gitleaks 8.30.1 (suma de verificación fijada)
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
      - name: Buscar secretos en el historial
        run: ./gitleaks git --redact --verbose --exit-code 1
# endif
# endif

  # Cada escáner va en su propio job: un hallazgo de semgrep no impide que corran los demás y la persona ve
  # todos los hallazgos de una vez.
  # Fuentes: https://docs.semgrep.dev/cli-reference , https://semgrep.dev/p/owasp-top-ten
  semgrep:
    name: Análisis estático (semgrep OWASP Top 10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Instalar semgrep
        run: python -m pip install semgrep==1.182.1
      - name: semgrep con las reglas OWASP Top 10
        run: semgrep scan --config p/owasp-top-ten --error --metrics=off

  # Una vez por carpeta de componente, en su propio job (no depende de semgrep).
  # Fuentes: https://pkg.go.dev/cmd/vet
  go-vet:
    name: Análisis estático (go vet) · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: {RAPID_COMPONENT_DIRS}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar que la carpeta del componente tiene código
        id: folder
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -d "$DIR" ] && [ -n "$(find "$DIR" -type f \( -name '*.go' -o -name go.mod \) -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)" ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Nada que analizar::$DIR no existe o no tiene código Go todavía: no se analizó nada."
            echo "Nada que analizar: $DIR no existe o no tiene código Go todavía." >> "$GITHUB_STEP_SUMMARY"
            echo "scan=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.folder.outputs.scan == 'true'
        with:
          go-version: stable
          cache: false
      - name: go vet
        if: steps.folder.outputs.scan == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -f go.mod ]; then
            go vet ./...
          else
            echo "::error title=Falta go.mod::$DIR tiene código Go pero no tiene go.mod: el análisis lo necesita."
            exit 1
          fi

  # Una vez por carpeta de componente (backend/, o la raíz en un proyecto de una carpeta): el manifiesto y
  # el lockfile están ahí.
  # Fuentes: https://go.dev/doc/tutorial/govulncheck ,
  # https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-commands
  dependencies:
    name: Dependencias (govulncheck) · ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: {RAPID_COMPONENT_DIRS}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Comprobar que la carpeta del componente tiene código
        id: folder
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -d "$DIR" ] && [ -n "$(find "$DIR" -type f \( -name '*.go' -o -name go.mod \) -not -path '*/node_modules/*' -not -path '*/.git/*' -print -quit)" ]; then
            echo "audit=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Nada que auditar::$DIR no existe o no tiene código Go todavía: no se auditó ninguna dependencia."
            echo "Nada que auditar: $DIR no existe o no tiene código Go todavía." >> "$GITHUB_STEP_SUMMARY"
            echo "audit=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.folder.outputs.audit == 'true'
        with:
          go-version: stable
          cache: false
      - name: Auditar las dependencias con govulncheck
        if: steps.folder.outputs.audit == 'true'
        working-directory: ${{ matrix.dir }}
        env:
          DIR: ${{ matrix.dir }}
        run: |
          if [ -f go.mod ]; then
            go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
            govulncheck ./...
          else
            echo "::error title=Faltan las dependencias::$DIR tiene código Go pero no tiene go.mod: genéralo y haz commit para que se audite."
            exit 1
          fi

# if corporate
  sbom:
    name: SBOM (anchore/sbom-action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json

  provenance:
    name: Procedencia firmada (SLSA Build L2)
    if: github.event_name == 'push'
    needs: sbom
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      # Cuando el proyecto tenga un artefacto desplegable (imagen, paquete, wheel), cambia
      # subject-path por ese artefacto: la procedencia debe describir lo que se publica.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.spdx.json
# endif
