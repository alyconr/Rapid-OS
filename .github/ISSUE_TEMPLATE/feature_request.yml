name: Feature request
description: Propose a change or a new capability.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should Rapid OS do? Say how it respects the invariants in CONTRIBUTING.md (for example, the person approves).
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Affected mode
      multiple: true
      options:
        - feature
        - bugfix
        - refactor
        - hardening
        - research
        - Onboarding (/rapid-init)
        - Not specific to a mode
    validations:
      required: true
