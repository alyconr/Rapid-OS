name: Bug report
description: Something in Rapid OS does not behave as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: To report a vulnerability, follow [SECURITY.md](https://github.com/alyconr/Rapid-OS/blob/main/SECURITY.md) instead of opening a public issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Include the exact command and its output, and any RAPIDxxxx code.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `rapid --version`
      placeholder: Rapid OS 3.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, Ubuntu 24.04, macOS 15...
    validations:
      required: true
  - type: input
    id: shell
    attributes:
      label: Shell
      placeholder: PowerShell 7, Git Bash, zsh...
    validations:
      required: true
  - type: dropdown
    id: harness
    attributes:
      label: Harness
      options:
        - Claude Code
        - Codex
        - Cursor
        - VS Code
        - Antigravity
        - None (rapid in a terminal)
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `rapid doctor`
      description: Run it in the affected project. Review it first and remove anything private.
      render: text
    validations:
      required: true
