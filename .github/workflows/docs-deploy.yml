name: Deploy Documentation
run-name: Deploy Documentation (${{ github.ref_name }})

on:
  workflow_dispatch:

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Documentation Artifact
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck documentation
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  smoke-test:
    name: Post-Deployment Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Validate deployed URL and run Smoke Tests
        env:
          RAPID_OS_LIVE_DOCS_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          if [ -z "$RAPID_OS_LIVE_DOCS_URL" ]; then
            echo "Error: Deployed page URL is empty. Cannot verify live deployment."
            exit 1
          fi
          echo "Testing live deployment at: ${RAPID_OS_LIVE_DOCS_URL}"
          for i in {1..6}; do
            echo "Attempt $i/6: Running live smoke tests..."
            if python -m unittest tests.test_documentation_deployment.TestLiveDocsSmoke -v; then
              echo "Smoke tests passed successfully on attempt $i."
              exit 0
            fi
            echo "Smoke test attempt $i failed. Waiting 10s for CDN propagation..."
            sleep 10
          done
          echo "Smoke tests failed after 6 attempts."
          exit 1
