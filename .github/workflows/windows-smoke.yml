name: Windows smoke

# What broke in the 3.2.0rc1 end-to-end run on Windows, checked on a real wheel in a clean venv.
# PYTHONUTF8 stays unset on purpose: it would hide the code page bug this job exists to catch (H-29).

on:
  pull_request:
    paths:
      - "rapid_os/**"
      - "templates/**"
      - "pyproject.toml"
      - "scripts/windows_smoke.py"
      - ".github/workflows/windows-smoke.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Wheel on Windows (Python 3.12)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install the wheel in a clean venv
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/rapid-env"
          "$RUNNER_TEMP/rapid-env/Scripts/python.exe" -m pip install dist/*.whl

      - name: Version, onboarding, spec with accents through a pipe, .cmd executable
        shell: pwsh
        run: python scripts/windows_smoke.py "$env:RUNNER_TEMP\rapid-env\Scripts\rapid.exe"

      - name: Regression tests of H-29, H-32 and H-38
        shell: pwsh
        run: python -m unittest tests.test_stdin_utf8_and_resolution tests.test_legacy_specs
