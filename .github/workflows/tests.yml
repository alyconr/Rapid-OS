name: Tests

# Pull requests run the fast suite on one Python version (a few minutes).
# The full suite (fast + slow end-to-end modules) on every supported Python runs
# after a merge to main, on tags, or by hand on any branch:
#   gh workflow run tests.yml --ref <branch>
# Locally: `python scripts/test.py` (fast) and `python scripts/test.py --all` (full).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  fast:
    name: Fast suite (Python 3.12)
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node.js (the stack catalog tests run it)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Verify bytecode compilation
        run: python -m compileall -q rapid.py rapid_os tests scripts

      - name: Run the fast suite in parallel
        run: python scripts/test.py

  full:
    name: Full suite (Python ${{ matrix.python-version }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go (the end-to-end test of a Go backend runs it)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Set up Node.js (the end-to-end tests of a Vue frontend run it)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*

      - name: Verify bytecode compilation
        run: python -m compileall -q rapid.py rapid_os tests scripts

      - name: Run unit and E2E tests in parallel
        run: python scripts/test.py --all

      - name: Run CLI smoke checks
        run: |
          python rapid.py --version
          python rapid.py --help
          python rapid.py guide
          python rapid.py doctor
          python rapid.py scan
          python rapid.py scan --json > /tmp/rapid-project-model.json
          python -m json.tool /tmp/rapid-project-model.json > /dev/null
          python rapid.py context --mode general
          python rapid.py context --mode general --json > /tmp/context.json
          python -m json.tool /tmp/context.json > /dev/null
          python rapid.py spec list
          python rapid.py spec list --json > /tmp/specs.json
          python -m json.tool /tmp/specs.json > /dev/null
          python rapid.py policy show
          python rapid.py policy show --json > /tmp/policy.json
          python -m json.tool /tmp/policy.json > /dev/null
          python rapid.py run list
          python rapid.py run list --json > /tmp/runs.json
          python -m json.tool /tmp/runs.json > /dev/null
          python rapid.py harness list
          python rapid.py harness list --json > /tmp/harnesses.json
          python -m json.tool /tmp/harnesses.json > /dev/null
          python rapid.py harness show codex
          python rapid.py harness show codex --json > /tmp/harness.json
          python -m json.tool /tmp/harness.json > /dev/null
          python rapid.py evidence --help
          python rapid.py eval --help

      - name: Build and verify wheel and sdist artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -f dist/rapid_os-3.2.0rc1-py3-none-any.whl
          test -f dist/rapid_os-3.2.0rc1.tar.gz

      - name: Verify clean wheel and sdist installation outside checkout
        run: |
          python -m venv /tmp/rapid-wheel-env
          /tmp/rapid-wheel-env/bin/pip install "$GITHUB_WORKSPACE/dist/rapid_os-3.2.0rc1-py3-none-any.whl"
          mkdir -p /tmp/rapid-clean-project/src /tmp/rapid-clean-project/.rapid-os/standards
          printf 'print("ok")\n' > /tmp/rapid-clean-project/src/app.py
          printf '# Tech Stack\nPython 3.12\n' > /tmp/rapid-clean-project/.rapid-os/standards/tech-stack.md
          printf '# Topology\nModular service\n' > /tmp/rapid-clean-project/.rapid-os/standards/topology.md
          cd /tmp/rapid-clean-project
          test "$(/tmp/rapid-wheel-env/bin/rapid --version)" = "Rapid OS 3.2.0rc1"
          /tmp/rapid-wheel-env/bin/rapid --help > /dev/null
          /tmp/rapid-wheel-env/bin/rapid guide > /dev/null
          /tmp/rapid-wheel-env/bin/rapid doctor
          /tmp/rapid-wheel-env/bin/rapid scan --write --json > /tmp/wheel-scan.json
          python -m json.tool /tmp/wheel-scan.json > /dev/null
          /tmp/rapid-wheel-env/bin/rapid validate
          python -m venv /tmp/rapid-sdist-env
          /tmp/rapid-sdist-env/bin/pip install "$GITHUB_WORKSPACE/dist/rapid_os-3.2.0rc1.tar.gz"
          test "$(/tmp/rapid-sdist-env/bin/rapid --version)" = "Rapid OS 3.2.0rc1"
