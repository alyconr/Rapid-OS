name: Tests

on:
  push:
  pull_request:

jobs:
  unittest:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"

    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify bytecode compilation
        run: python -m compileall -q rapid.py rapid_os tests

      - name: Run unit and E2E tests
        run: python -m unittest discover

      - name: Run CLI smoke checks
        run: |
          python rapid.py --version
          python rapid.py --help
          python rapid.py guide
          python rapid.py doctor
          python rapid.py scan
          python rapid.py scan --json > /tmp/rapid-project-model.json
          python -m json.tool /tmp/rapid-project-model.json > /dev/null
          python rapid.py context --mode general
          python rapid.py context --mode general --json > /tmp/context.json
          python -m json.tool /tmp/context.json > /dev/null
          python rapid.py spec list
          python rapid.py spec list --json > /tmp/specs.json
          python -m json.tool /tmp/specs.json > /dev/null
          python rapid.py policy show
          python rapid.py policy show --json > /tmp/policy.json
          python -m json.tool /tmp/policy.json > /dev/null
          python rapid.py run list
          python rapid.py run list --json > /tmp/runs.json
          python -m json.tool /tmp/runs.json > /dev/null
          python rapid.py harness list
          python rapid.py harness list --json > /tmp/harnesses.json
          python -m json.tool /tmp/harnesses.json > /dev/null
          python rapid.py harness show codex
          python rapid.py harness show codex --json > /tmp/harness.json
          python -m json.tool /tmp/harness.json > /dev/null
          python rapid.py evidence --help
          python rapid.py eval --help

      - name: Build and verify wheel and sdist artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build
          test -f dist/rapid_os-3.0.0-py3-none-any.whl
          test -f dist/rapid_os-3.0.0.tar.gz

      - name: Verify clean wheel and sdist installation outside checkout
        run: |
          python -m venv /tmp/rapid-wheel-env
          /tmp/rapid-wheel-env/bin/pip install "$GITHUB_WORKSPACE/dist/rapid_os-3.0.0-py3-none-any.whl"
          mkdir -p /tmp/rapid-clean-project/src /tmp/rapid-clean-project/.rapid-os/standards
          printf 'print("ok")\n' > /tmp/rapid-clean-project/src/app.py
          printf '# Tech Stack\nPython 3.12\n' > /tmp/rapid-clean-project/.rapid-os/standards/tech-stack.md
          printf '# Topology\nModular service\n' > /tmp/rapid-clean-project/.rapid-os/standards/topology.md
          cd /tmp/rapid-clean-project
          test "$(/tmp/rapid-wheel-env/bin/rapid --version)" = "Rapid OS 3.0.0"
          /tmp/rapid-wheel-env/bin/rapid --help > /dev/null
          /tmp/rapid-wheel-env/bin/rapid guide > /dev/null
          /tmp/rapid-wheel-env/bin/rapid doctor
          /tmp/rapid-wheel-env/bin/rapid scan --write --json > /tmp/wheel-scan.json
          python -m json.tool /tmp/wheel-scan.json > /dev/null
          /tmp/rapid-wheel-env/bin/rapid validate
          python -m venv /tmp/rapid-sdist-env
          /tmp/rapid-sdist-env/bin/pip install "$GITHUB_WORKSPACE/dist/rapid_os-3.0.0.tar.gz"
          test "$(/tmp/rapid-sdist-env/bin/rapid --version)" = "Rapid OS 3.0.0"
