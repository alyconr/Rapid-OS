name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "website/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install documentation dependencies
        working-directory: website
        run: npm ci

      - name: Typecheck documentation site
        working-directory: website
        run: npm run typecheck

      - name: Build documentation
        working-directory: website
        run: npm run build

      - name: Verify Documentation Static Build Integrity
        env:
          RAPID_DOCS_STRICT_BUILD_CHECK: "1"
        run: python -m unittest tests.test_documentation_deployment.TestDocumentationStaticBuildIntegrity -v
